name: Acme targeted checks

# Quality checks for the pull request contents. This workflow is advisory as a
# security boundary: pull_request runs the workflow file from the pull request,
# so an author can edit it. Require the change-scope check to block unauthorized
# files. Branch protection may also require this job, but that does not make it
# tamper-proof.
on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted-checks:
    name: targeted-checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install SQLGlot and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Style the Acme guardrail
        run: |
          ruff check scripts/acme tests/acme
          ruff format --check scripts/acme tests/acme

      - name: Test the change-scope guardrail
        run: python -m unittest tests.acme.test_check_change_scope

      - name: Lint changed Python and run mapped tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD -- '*.py')
          existing=()
          for path in "${changed[@]}"; do
            if [[ -f "$path" ]]; then
              existing+=("$path")
            fi
          done
          if ((${#existing[@]})); then
            ruff check "${existing[@]}"
            ruff format --check "${existing[@]}"
          fi
          # After this framework is on the default branch, select tests with the
          # checker and mappings from the base commit. This introducing pull
          # request is based on a commit that has neither interface. Skip mapped
          # dialect tests only for that governance-only diff. A feature diff
          # fails closed instead of skipping.
          if git cat-file -e "$BASE_SHA:.github/acme/test-mappings.txt" 2>/dev/null \
            && git grep -q -F -- '--print-tests' "$BASE_SHA" -- scripts/acme/check_change_scope.py
          then
            git show "$BASE_SHA:scripts/acme/check_change_scope.py" > /tmp/check_change_scope.py
            python /tmp/check_change_scope.py \
              --base "$BASE_SHA" --head HEAD --print-tests > /tmp/acme-targets.txt
            mapfile -t targets < /tmp/acme-targets.txt
            if ((${#targets[@]} == 0)); then
              echo "No mapped tests for this diff"
            elif printf '%s\n' "${targets[@]}" | grep -qx FALLBACK; then
              SKIP_INTEGRATION=1 python -m unittest
            else
              python -m unittest "${targets[@]}"
            fi
          else
            python scripts/acme/check_change_scope.py \
              --base "$BASE_SHA" --head HEAD --migration-skip
          fi
